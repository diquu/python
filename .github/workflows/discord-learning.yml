name: Discord Learning Journal

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send every commit to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              raise SystemExit("Missing DISCORD_WEBHOOK repository secret.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          commits = event.get("commits", [])
          if not commits:
              print("No commits in this push.")
              raise SystemExit(0)

          for commit in commits:
              full_message = (commit.get("message") or "").strip()
              title, separator, explanation = full_message.partition("\n")
              explanation = explanation.strip()

              if not explanation:
                  explanation = (
                      "⚠️ Este commit no incluye una explicación de aprendizaje. "
                      "En el próximo commit, agregá el detalle en el cuerpo del mensaje "
                      "para que el diario pueda registrar exactamente qué estudiaste."
                  )

              author = (commit.get("author") or {}).get("name") or "Autor desconocido"
              url = commit.get("url", "")
              short_id = commit.get("id", "")[:7]

              payload = {
                  "embeds": [{
                      "title": ("🐍 " + (title or "Nuevo commit"))[:256],
                      "description": explanation[:4000],
                      "url": url,
                      "color": 3447003,
                      "fields": [
                          {"name": "Autor", "value": author[:1024], "inline": True},
                          {"name": "Commit", "value": short_id or "N/D", "inline": True},
                          {"name": "Repositorio", "value": event.get("repository", {}).get("full_name", "diquu/python"), "inline": True}
                      ],
                      "footer": {"text": "Diario de aprendizaje · Python"}
                  }]
              }

              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"Discord notification sent for {short_id}: HTTP {response.status}")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Discord returned HTTP {error.code}; check the webhook URL and permissions.")
          PY
