name: Discord GitHub logs

on:
  push:
  pull_request:
    types: [opened, reopened, closed, synchronize, ready_for_review]
  issues:
    types: [opened, edited, closed, reopened]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send learning notes to Discord
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing repository secret DISCORD_WEBHOOK"
            exit 1
          fi

          CHANGED_PY=$(git diff --name-only "$BEFORE" "$AFTER" -- '*.py')
          if [ -z "$CHANGED_PY" ]; then
            echo "No Python files changed; no learning note to publish."
            exit 0
          fi

          export CHANGED_PY
          python - <<'PY' > discord-message.json
          import ast
          import json
          import os
          from pathlib import Path

          repo = os.environ["REPO"]
          actor = os.environ["ACTOR"]
          files = os.environ["CHANGED_PY"].splitlines()
          notes = []

          for filename in files:
              path = Path(filename)
              if not path.is_file():
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
                  module = ast.parse(source)
                  doc = ast.get_docstring(module, clean=True) or ""
              except (UnicodeDecodeError, SyntaxError):
                  continue

              learned = ""
              practiced = ""
              for line in doc.splitlines():
                  key, sep, value = line.partition(":")
                  if not sep:
                      continue
                  if key.strip().lower() == "aprendí":
                      learned = value.strip()
                  elif key.strip().lower() == "practiqué":
                      practiced = value.strip()

              if learned:
                  item = f"📘 **{path.name}**\n**Aprendiste:** {learned}"
                  if practiced:
                      item += f"\n**Práctica:** {practiced}"
                  item += f"\nhttps://github.com/{repo}/blob/{os.environ['AFTER']}/{filename}"
                  notes.append(item)

          if not notes:
              message = "Subiste archivos Python, pero no encontré una nota Aprendí: en sus docstrings. Agregala al inicio del archivo para registrar qué estudiaste."
          else:
              message = f"🎓 **Nuevo aprendizaje de {actor}**\nRepositorio: {repo}\n\n" + "\n\n".join(notes)
              if len(message) > 1900:
                  message = message[:1880] + "\n… (mensaje recortado)"
          print(json.dumps({"content": message}, ensure_ascii=False))
          PY

          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d @discord-message.json "$DISCORD_WEBHOOK_URL"

      - name: Send activity notifications
        if: github.event_name != 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing repository secret DISCORD_WEBHOOK"
            exit 1
          fi

          case "$EVENT" in
            pull_request)
              TITLE="Pull request: $PR_TITLE"
              LINK="$PR_URL"
              ;;
            issues)
              TITLE="Issue: $ISSUE_TITLE"
              LINK="$ISSUE_URL"
              ;;
            release)
              TITLE="Release: $RELEASE_TAG"
              LINK="$RELEASE_URL"
              ;;
          esac

          MESSAGE="**$TITLE**"$'\n'"Repositorio: $REPO"$'\n'"Autor: $ACTOR"$'\n'"Acción: $ACTION"$'\n'"$LINK"
          jq -n --arg content "$MESSAGE" '{content: $content}' |
            curl --fail-with-body -sS -H "Content-Type: application/json" \
              -d @- "$DISCORD_WEBHOOK_URL"